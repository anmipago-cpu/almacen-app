name: Backup Automático

on:
  schedule:
    - cron: '0 5 * * 1-6'
    - cron: '0 5 * * 0'
  workflow_dispatch:
    inputs:
      tipo:
        description: 'Tipo: diario | completo'
        required: false
        default: 'completo'

jobs:
  backup:
    name: Backup Base de Datos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Exportar tablas de Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/backup_db.py

      - name: Guardar en rama backups (GitHub)
        run: |
          DATE=$(TZ=America/Bogota date +%Y-%m-%d)
          git config user.name  "Backup Bot"
          git config user.email "backup@almacen-app.bot"

          git fetch origin backups 2>/dev/null || true
          git checkout backups 2>/dev/null || git checkout --orphan backups

          if git show-ref --verify --quiet refs/heads/backups; then
            git rm -rf --cached . 2>/dev/null || true
          fi

          mkdir -p "$DATE"
          cp -r "backup_output/$DATE/." "$DATE/"

          find . -maxdepth 1 -type d -name "20*" | sort | head -n -30 | xargs -r git rm -rf --

          git add .
          git diff --cached --quiet || git commit -m "backup: $DATE"
          git push origin backups

