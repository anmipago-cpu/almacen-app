name: Backup Automático

on:
  schedule:
    - cron: '0 5 * * 1-6'
    - cron: '0 5 * * 0'
  workflow_dispatch:
    inputs:
      tipo:
        description: 'Tipo: diario | completo'
        required: false
        default: 'completo'

jobs:
  backup:
    name: Backup Base de Datos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Exportar tablas de Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/backup_db.py

      - name: Guardar en rama backups (GitHub)
        run: |
          DATE=$(TZ=America/Bogota date +%Y-%m-%d)

          # Guardar los JSON en un directorio temporal fuera del repo
          TEMP=$(mktemp -d)
          cp -r "backup_output/$DATE/." "$TEMP/"

          git config user.name  "Backup Bot"
          git config user.email "backup@almacen-app.bot"

          # Ir a rama backups limpia (solo backups, sin código fuente)
          git fetch origin backups 2>/dev/null || true
          if git ls-remote --exit-code --heads origin backups > /dev/null 2>&1; then
            git checkout backups
          else
            git checkout --orphan backups
            git rm -rf . --quiet 2>/dev/null || true
            rm -rf ./* ./.*  2>/dev/null || true
          fi

          # Copiar solo los JSON del backup
          mkdir -p "$DATE"
          cp "$TEMP/"*.json "$DATE/"

          # Eliminar backups con más de 30 días
          find . -maxdepth 1 -type d -name "20*" | sort | head -n -30 | xargs -r rm -rf

          git add "$DATE/"
          git diff --cached --quiet || git commit -m "backup: $DATE"
          git push --force origin backups

